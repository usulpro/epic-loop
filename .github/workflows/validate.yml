name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Validate epic-loop package
        run: pnpm run validate
